services:
  postgres:
    image: postgres:17
    container_name: wzi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    volumes:
      - ./postgres/data:/var/lib/postgresql/data

    networks:
      - wzi_backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  wzi_backend:
    name: wzi_backend
    driver: bridge

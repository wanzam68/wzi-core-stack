services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: wzi-n8n
    restart: unless-stopped

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: 1

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"

      GENERIC_TIMEZONE: Asia/Kuala_Lumpur
      TZ: Asia/Kuala_Lumpur

    volumes:
      - ./n8n/data:/home/node/.n8n

    ports:
      - "127.0.0.1:5678:5678"

    networks:
      - wzi_backend
      - wzi_frontend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile

    image: wzi-operations-dashboard:1.5.0-dev

    container_name: wzi-dashboard

    restart: unless-stopped

    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./dashboard/storage/live:/var/www/dashboard-data:ro
    networks:
      - wzi_frontend

    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent http://127.0.0.1/ >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  wzi_frontend:
    name: wzi_frontend
    driver: bridge
